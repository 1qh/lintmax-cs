name: release
on:
  push:
    tags: ["v*"]
permissions:
  actions: write
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: pack
        run: dotnet pack -c Release -o out
      - name: push
        # A step's `if` cannot read that step's own `env`, so the key is set on the job: set there, it is
        # visible here and pushes; absent, the step skips and the prune steps below still run.
        if: ${{ env.NUGET_KEY != '' }}
        run: dotnet nuget push "out/*.nupkg" -k "$NUGET_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate
      - name: prune releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prune-old-releases.sh
      - name: prune ci runs
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: bash scripts/prune-ci-runs.sh
