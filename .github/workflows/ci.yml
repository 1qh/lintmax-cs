name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ${{ vars.RUNNER_LABEL }}
    steps:
      - uses: actions/checkout@v4
      - name: pack + install lintmax-cs (outside checkout)
        run: |
          set -eu
          dotnet pack -c Release -o pack
          tools=$(mktemp -d)
          echo "TOOLS=${tools}" >> "${GITHUB_ENV}"
          dotnet tool install --tool-path "${tools}" lintmax-cs --add-source pack
      - name: check (dogfood)
        run: |
          set -eu
          "${TOOLS}/lintmax-cs" check
